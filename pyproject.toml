[project]
name = "oxid-dbpedia-ns"
version = "0.1.0"
description = "Build pipeline for the OxidDB neurosymbolic DBpedia dataset: nested 50K/100K/180K tiers of Western European and American entities with abstracts, DBO types, typed edges, an OWL 2 EL TBox and text-embedding-3-small vectors."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Moonlight Array", email = "info@moonlightarray.nl" }]
keywords = ["dbpedia", "knowledge-graph", "owl", "embeddings", "neurosymbolic", "vector-search", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]
dependencies = [
    "polars>=1.10",
    "pyarrow>=17",
    "numpy>=1.26",
    "rdflib>=7.0",
    "openai>=1.40",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
publish = ["huggingface_hub>=0.26", "kaggle>=1.6"]


[project.urls]
Homepage = "https://github.com/Oxid-Ecosystem/oxid-dbpedia-ns"
Repository = "https://github.com/Oxid-Ecosystem/oxid-dbpedia-ns"
Dataset = "https://huggingface.co/datasets/Oxid-Ecosystem/oxid-dbpedia-ns"
Changelog = "https://github.com/Oxid-Ecosystem/oxid-dbpedia-ns/blob/main/CHANGELOG.md"

[project.scripts]
oxid-dbpedia-ns = "oxid_dbpedia_ns.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oxid_dbpedia_ns"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
